<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Web制作・デザインの日常作業に使う、SACのツール集。">
  <title>SAC WEB TOOLS</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5f0;
      --ink: #21231f;
      --muted: #545952;
      --line: #cdcec5;
      --accent: #ff633b;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.7 system-ui, -apple-system, "Yu Gothic UI", Meiryo, sans-serif;
    }

    .shell {
      width: min(100% - 2.5rem, 72rem);
      margin-inline: auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      min-height: 4.25rem;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      font: 700 .875rem/1 var(--mono);
      letter-spacing: .08em;
    }

    .mark {
      display: grid;
      width: 1.6rem;
      aspect-ratio: 1;
      place-items: center;
      background: var(--accent);
      color: var(--ink);
    }

    main { flex: 1; }

    .hero {
      padding-block: clamp(3.25rem, 8vw, 6.25rem) clamp(2.5rem, 6vw, 4.5rem);
      border-bottom: 1px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 7.25rem);
      font-weight: 850;
      letter-spacing: -.075em;
      line-height: .96;
    }

    .hero p {
      margin: 1.5rem 0 0;
      color: var(--muted);
    }

    .directory { padding-block: 1.5rem 4rem; }

    .directory h2 {
      margin: 0 0 1rem;
      font-size: 1.125rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      height: 100%;
      padding: clamp(1.125rem, 3vw, 1.5rem);
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }

    .tool-card:hover { border-color: var(--ink); }
    .tool-card:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .tool-icon {
      display: grid;
      width: 2.75rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: .5rem;
      background: #ffe3da;
      font: 700 1.125rem/1 var(--mono);
    }

    .tool-card h3 {
      margin: 1rem 0 .35rem;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .tool-card p {
      flex: 1;
      margin: 0 0 1.25rem;
      color: var(--muted);
    }

    .card-action {
      font-size: .875rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: .25em;
    }

    footer {
      padding-block: 1rem 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <header class="shell site-header">
    <div class="wordmark"><span class="mark" aria-hidden="true">S</span> SAC</div>
  </header>

  <main class="shell">
    <div class="hero">
      <h1>SAC WEB TOOLS</h1>
      <p>Web制作・デザインの日常作業に使うツール集。</p>
    </div>

    <section class="directory" aria-labelledby="tools-heading">
      <h2 id="tools-heading">ツール一覧</h2>
      <ul class="tool-grid">
        <!-- ツールを追加する場合は li を複製し、リンクと説明を差し替えてください。 -->
        <li>
          <a class="tool-card" href="./text-link-shortener.html" aria-labelledby="shortener-title" aria-describedby="shortener-description">
            <span class="tool-icon" aria-hidden="true">#:~</span>
            <h3 id="shortener-title" lang="en">Text Link Shortener</h3>
            <p id="shortener-description">ページ内のテキストを指すURLから、前後の文脈を取り除いて短くします。</p>
            <span class="card-action" aria-hidden="true">ツールを開く</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="shell">入力データの変換はブラウザ内で行います。</footer>
</body>
</html>
